<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Among Us Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#020208;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;color:#e0e0ff;overflow:hidden;user-select:none}
#wrap{position:relative}
canvas{display:block}

/* ── Overlay (meetings / tasks / menu) ─────────────────────── */
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,2,18,.91);backdrop-filter:blur(4px);z-index:30}
#ov.on{display:flex}
#pnl{background:linear-gradient(155deg,#0d0d28,#080818);border:1px solid rgba(100,130,255,.28);border-radius:14px;padding:26px 34px;max-width:720px;width:96%;max-height:95vh;overflow-y:auto;box-shadow:0 0 60px rgba(80,100,255,.1)}
.logo{font-family:'Orbitron',sans-serif;font-size:2.4em;font-weight:900;color:#ff3333;text-align:center;letter-spacing:6px;text-shadow:0 0 28px rgba(255,51,51,.5);margin-bottom:6px}
.sub{text-align:center;color:#7777bb;font-size:.88em;margin-bottom:20px}
.btn{display:inline-block;padding:10px 26px;margin:5px;border:1px solid;border-radius:6px;font-family:inherit;font-size:1em;font-weight:bold;cursor:pointer;letter-spacing:1px;transition:all .13s}
.btn:hover{transform:translateY(-1px)}
.btn-red{background:rgba(180,20,20,.8);border-color:#cc2222;color:#fff}.btn-red:hover{background:rgba(220,30,30,.9)}
.btn-blue{background:rgba(20,55,185,.8);border-color:#2244cc;color:#fff}.btn-blue:hover{background:rgba(30,75,220,.9)}
.btn-dark{background:rgba(35,35,70,.8);border-color:#55559a;color:#aaa}.btn-dark:hover{background:rgba(50,50,100,.9)}
.cbox{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:13px 18px;margin:10px 0;font-size:.86em;line-height:1.9}
.key{background:rgba(100,130,255,.18);border:1px solid rgba(100,130,255,.38);border-radius:4px;padding:1px 7px;color:#88aaff;font-family:'Orbitron',sans-serif;font-size:.82em}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.vcard{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 6px;cursor:pointer;text-align:center;transition:all .13s;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.84em}
.vcard:hover:not([disabled]):not(.voted){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.28)}
.vcard.voted{border-color:#ff4444;background:rgba(255,40,40,.1)}
.vcard[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.vdot{width:30px;height:30px;border-radius:50%;margin:0 auto 2px}
.chatlog{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:8px 10px;max-height:88px;overflow-y:auto;font-size:.81em;color:#999;text-align:left;margin:8px 0}
.chatlog div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.mtimer{font-size:1.38em;color:#ffaa00;text-align:center;margin:8px 0;font-family:'Orbitron',sans-serif}
.tbox{background:rgba(0,0,20,.55);border:1px solid rgba(100,155,255,.28);border-radius:8px;padding:18px;margin:12px 0}
.wrow{display:flex;justify-content:space-between;align-items:center;min-height:190px}
.wcol{display:flex;flex-direction:column;gap:18px}
.wnode{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #666;transition:all .13s}
.wnode:hover:not(.wmatched){transform:scale(1.24);border-color:#fff}
.wnode.wsel{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
.wnode.wmatched{opacity:.38;cursor:not-allowed}
.pbbg{background:#111;border:1px solid #444;border-radius:20px;height:32px;overflow:hidden;margin:12px 0}
.pbfill{height:100%;border-radius:20px;background:linear-gradient(90deg,#1144cc,#44aaff)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:210px;margin:0 auto}
.nbtn{background:rgba(18,40,105,.6);border:1px solid rgba(100,155,255,.28);color:#fff;padding:13px;border-radius:6px;font-family:inherit;font-size:1.18em;cursor:pointer;transition:all .12s;text-align:center}
.nbtn:hover{background:rgba(35,80,200,.65);transform:scale(1.04)}
.cdisp{background:rgba(0,0,0,.5);border:1px solid #444;border-radius:6px;padding:10px;font-size:1.55em;letter-spacing:8px;text-align:center;min-height:44px;margin:10px 0;font-family:'Orbitron',monospace}
.colsel{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.cbtn{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .13s;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cbtn:hover{transform:scale(1.1)}
.cbtn.csel{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.55)}

/* ── Action Buttons ──────────────────────────────────────────── */
#actionBar{
  position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  display:none;align-items:flex-end;gap:10px;z-index:20;pointer-events:all;
}
.ab{
  width:82px;height:82px;border-radius:50%;
  background:rgba(18,18,45,.88);border:3px solid rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;gap:2px;padding:10px;
  transition:border-color .13s,background .13s,transform .1s,opacity .13s;
  font-family:'Share Tech Mono',monospace;font-size:10px;font-weight:bold;
  color:#ccc;position:relative;flex-shrink:0;
}
.ab:active{transform:scale(.93)!important}
.ab img,.ab svg{width:36px;height:36px;pointer-events:none;flex-shrink:0}
.ab-lbl{font-size:9px;text-align:center;pointer-events:none;line-height:1.1;margin-top:1px}
/* States */
.ab.s-on  {border-color:rgba(255,255,255,.82);background:rgba(50,55,120,.92);color:#fff}
.ab.s-kill{border-color:#ff3333;background:rgba(130,10,10,.95);color:#fff}
.ab.s-off {opacity:.38;cursor:not-allowed}
.ab.s-vent{border-color:#22ff44;background:rgba(10,70,20,.92);color:#aeffbe}
.ab.s-sab {border-color:#cc44ff;background:rgba(60,10,100,.92);color:#e0bbff}
/* CD badge */
.ab-cd{
  position:absolute;top:3px;right:3px;
  background:rgba(0,0,0,.75);border-radius:8px;
  padding:1px 5px;font-size:9px;color:#ffcc44;pointer-events:none;
}
/* Report sits left, others right — gap spacer in middle */
.ab-spacer{flex:1;min-width:18px;max-width:80px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="680"></canvas>

  <!-- ── Action Button Bar ──────────────────────────────────── -->
  <div id="actionBar">
    <!-- Left cluster -->
    <div id="abReport" class="ab s-off" onclick="AB.report()" title="Report body [R]">
      <img src="among us/Report.svg" onerror="this.outerHTML=ICONS.report" alt="">
      <div class="ab-lbl">Report</div>
    </div>

    <div class="ab-spacer"></div>

    <!-- Right cluster -->
    <div id="abUse" class="ab s-off" onclick="AB.use()" title="Use task [E]">
      <img src="among us/Use.svg" onerror="this.outerHTML=ICONS.use" alt="">
      <div class="ab-lbl">Use</div>
    </div>
    <div id="abKill" class="ab s-off" onclick="AB.kill()" title="Kill [Q]" style="display:none">
      <img src="among us/Kill.svg" onerror="this.outerHTML=ICONS.kill" alt="">
      <div class="ab-lbl" id="abKillLbl">Kill</div>
      <div class="ab-cd" id="abKillCd" style="display:none"></div>
    </div>
    <div id="abVent" class="ab s-off" onclick="AB.vent()" title="Vent [V]" style="display:none">
      <img src="among us/Vent.svg" onerror="this.outerHTML=ICONS.vent" alt="">
      <div class="ab-lbl">Vent</div>
    </div>
    <div id="abSab" class="ab s-off" onclick="AB.sabotage()" title="Sabotage [F]" style="display:none">
      <img src="among us/Sabotage.svg" onerror="this.outerHTML=ICONS.sabotage" alt="">
      <div class="ab-lbl" id="abSabLbl">Sabotage</div>
      <div class="ab-cd" id="abSabCd" style="display:none"></div>
    </div>
  </div>

  <!-- ── HTML Overlay ──────────────────────────────────────── -->
  <div id="ov"><div id="pnl"></div></div>
</div>

<script>

  camY=Math.max(0,Math.min(MAP_H-H,ME.y-H/2));
}

// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let GS='menu';

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!keys[k]){keys[k]=true;onKey(e.key);}
  if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

cv.addEventListener('click',e=>{
  if(GS!=='playing')return;
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(ventMenuOpen){ventBtns.forEach(b=>{if(inRect(mx,my,b))useVent(b.id);});return;}
  if(sabMenuOpen&&myRole==='impostor'){sabBtns.forEach(b=>{if(inRect(mx,my,b))activateSab(b.k);});return;}
});

const inRect=(mx,my,b)=>mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h;

// UTILS
// ═══════════════════════════════════════════════════════════════
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function darken(h,a){const n=parseInt(h.replace('#',''),16);return`rgb(${Math.max(0,(n>>16&255)-a)},${Math.max(0,(n>>8&255)-a)},${Math.max(0,(n&255)-a)})`;}
const showOv=()=>ov.classList.add('on');
const hideOv=()=>ov.classList.remove('on');

// ═══════════════════════════════════════════════════════════════
// ACTION BUTTONS  — state machine
// ═══════════════════════════════════════════════════════════════
const AB={
  report(){ onKey('r'); },
  use()   { onKey('e'); },
  kill()  { onKey('q'); },
  vent()  { onKey('v'); },
  sabotage(){ onKey('f'); },
};
window.AB=AB;

function _ab(id,state,lbl,cd){
  const el=document.getElementById(id);if(!el)return;
  el.className='ab '+state;
  const l=el.querySelector('.ab-lbl');if(l&&lbl!==undefined)l.textContent=lbl;
  const c=el.querySelector('.ab-cd');
  if(c){c.style.display=cd?'block':'none';if(cd)c.textContent=cd;}
}
function _abShow(id,v){const el=document.getElementById(id);if(el)el.style.display=v?'flex':'none';}

function updateActionBar(){
  const bar=document.getElementById('actionBar');
  if(!bar)return;
  const show=GS==='playing'&&ME&&!ME.dead;
  bar.style.display=show?'flex':'none';
  if(!show)return;

  const nearBody=bodies.some(b=>D(ME,b)<BODY_R);
  const nearTask=tasks.some(t=>!t.done&&D(ME,t)<TASK_R);
  const nearFix=activeSab&&D(ME,{x:SAB_DEFS[activeSab.type].fixX,y:SAB_DEFS[activeSab.type].fixY})<TASK_R;
  const nearVent=VENTS.some(v=>D(ME,v)<VENT_R);
  const nearTgt=players.some(p=>p!==ME&&!p.dead&&p.role!=='impostor'&&D(ME,p)<KILL_R);

  // Report — always visible, active when near body
  _ab('abReport',nearBody?'s-on':'s-off');

  if(myRole==='crewmate'){
    _abShow('abUse',true);_abShow('abKill',false);_abShow('abVent',false);_abShow('abSab',false);
    _ab('abUse',(nearTask||nearFix)?'s-on':'s-off','Use');
  } else {
    // Impostor
    _abShow('abUse',false);_abShow('abKill',true);_abShow('abVent',true);_abShow('abSab',true);

    // Kill
    const kReady=killCd<=0&&nearTgt;
    _ab('abKill',kReady?'s-kill':'s-off',killCd>0?killCd.toFixed(0)+'s':'Kill',
        killCd>0?killCd.toFixed(0)+'s':null);

    // Vent
    _ab('abVent',nearVent?'s-vent':'s-off','Vent');

    // Sabotage
    const sReady=sabCd<=0&&!sabMenuOpen;
    _ab('abSab',(sabMenuOpen?'s-sab':sReady?'s-sab':'s-off'),sabCd>0?sabCd.toFixed(0)+'s':'Sabotage',
        sabCd>0?sabCd.toFixed(0)+'s':null);
  }
}

function drawMap(){
  cx.fillStyle='#020208';cx.fillRect(0,0,W,H);
  STARS.forEach(s=>{
    const sx=wx(s.x),sy=wy(s.y);
    if(sx<-2||sx>W+2||sy<-2||sy>H+2)return;
    cx.fillStyle=`rgba(200,220,255,${s.a})`;cx.beginPath();cx.arc(sx,sy,s.r,0,Math.PI*2);cx.fill();
  });
  ROOMS.forEach(r=>{
    const sx=wx(r.x),sy=wy(r.y);
    if(sx>W||sy>H||sx+r.w<0||sy+r.h<0)return;
    cx.fillStyle=r.c;cx.fillRect(sx,sy,r.w,r.h);
    cx.strokeStyle='rgba(255,255,255,.03)';cx.lineWidth=1;
    for(let gx=r.x+30;gx<r.x+r.w;gx+=30){const x2=wx(gx);cx.beginPath();cx.moveTo(x2,sy);cx.lineTo(x2,sy+r.h);cx.stroke();}
    for(let gy=r.y+30;gy<r.y+r.h;gy+=30){const y2=wy(gy);cx.beginPath();cx.moveTo(sx,y2);cx.lineTo(sx+r.w,y2);cx.stroke();}
    cx.strokeStyle='rgba(100,140,220,.3)';cx.lineWidth=1.5;cx.strokeRect(sx+.5,sy+.5,r.w-1,r.h-1);
    if(r.n){cx.fillStyle='rgba(180,210,255,.18)';cx.font='bold 11px "Share Tech Mono"';cx.textAlign='center';cx.fillText(r.n.toUpperCase(),sx+r.w/2,sy+16);}
  });

  // Room furniture & decorations
  drawRoomDetails();

  // Vents
  const t=performance.now()/1000;
  VENTS.forEach(v=>{
    const sx=wx(v.x),sy=wy(v.y);
    if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;
    const near=myRole==='impostor'&&ME&&!ME.dead&&D(ME,v)<VENT_R;
    cx.fillStyle=near?'rgba(30,80,30,.8)':'rgba(12,35,12,.7)';
    cx.strokeStyle=near?'rgba(80,255,100,.9)':'rgba(60,130,60,.55)';
    cx.lineWidth=near?2:1.5;
    cx.beginPath();cx.arc(sx,sy,10,0,Math.PI*2);cx.fill();cx.stroke();
    cx.strokeStyle=near?'rgba(80,255,100,.7)':'rgba(60,130,60,.4)';cx.lineWidth=1;
    for(let i=-6;i<=6;i+=4){cx.beginPath();cx.moveTo(sx-8,sy+i);cx.lineTo(sx+8,sy+i);cx.stroke();}
  });

  // Emergency button
  const ebp=.88+.12*Math.sin(t*3),ex=wx(EB.x),ey=wy(EB.y);
  if(ex>-20&&ex<W+20&&ey>-20&&ey<H+20){
    cx.fillStyle='#bb1111';cx.beginPath();cx.arc(ex,ey,14*ebp,0,Math.PI*2);cx.fill();
    cx.strokeStyle=`rgba(255,80,80,${.6+.4*ebp})`;cx.lineWidth=2.5;cx.stroke();
    cx.fillStyle='white';cx.font='bold 7px "Share Tech Mono"';cx.textAlign='center';cx.fillText('MEET',ex,ey+3);
    if(ME&&!ME.dead&&D(ME,EB)<EB_R){
      cx.fillStyle='#ff5555';cx.font='bold 11px "Share Tech Mono"';cx.fillText('[SPACE] Emergency Meeting',ex,ey-28);
    }
  }

  // Sabotage fix spot
  if(activeSab){
    const d=SAB_DEFS[activeSab.type],blink=Math.sin(t*7)>.3;
    if(blink){
      const fx=wx(d.fixX),fy=wy(d.fixY);
      if(fx>-20&&fx<W+20&&fy>-20&&fy<H+20){
        cx.fillStyle='#ff2222';cx.strokeStyle='#ff6666';cx.lineWidth=2;
        cx.beginPath();cx.moveTo(fx,fy-13);cx.lineTo(fx+13,fy);cx.lineTo(fx,fy+13);cx.lineTo(fx-13,fy);cx.closePath();cx.fill();cx.stroke();
        cx.fillStyle='white';cx.font='bold 8px "Share Tech Mono"';cx.textAlign='center';cx.fillText('FIX',fx,fy+3);
        if(ME&&!ME.dead&&D(ME,{x:d.fixX,y:d.fixY})<TASK_R){
          cx.fillStyle='#ff8888';cx.font='bold 11px "Share Tech Mono"';cx.fillText(`[E] Fix ${d.n}`,fx,fy-22);
        }
      }
    }
  }
}

function drawTasks(){
  const t=performance.now()/1000;
  tasks.forEach(task=>{
    if(task.done)return;
    const sx=wx(task.x),sy=wy(task.y);
    if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;
    const near=ME&&!ME.dead&&D(ME,task)<TASK_R;
    const pulse=near?.5+.5*Math.sin(t*7):1;
    cx.save();cx.translate(sx,sy);cx.rotate(t*.75);cx.scale(pulse,pulse);

    cx.beginPath();cx.moveTo(0,-9);cx.lineTo(9,0);cx.lineTo(0,9);cx.lineTo(-9,0);cx.closePath();cx.fill();

      cx.fillStyle='#fff';cx.font='9px "Share Tech Mono"';cx.textAlign='center';cx.fillText(task.n,sx,sy-18);
    }
  });
}

  } else if(activeSab&&activeSab.type==='lights'){
    cx.fillStyle='rgba(70,55,0,.85)';cx.fillRect(W/2-145,5,290,24);

    cx.beginPath();cx.arc(wx(ME.x),wy(ME.y),KILL_R,0,Math.PI*2);cx.stroke();cx.setLineDash([]);

  drawMinimap();

// ═══════════════════════════════════════════════════════════════
// KEY HANDLER
// ═══════════════════════════════════════════════════════════════
function onKey(key){
  const k=typeof key==='string'?key.toLowerCase():key;
  if(k==='escape'||k==='esc'){ventMenuOpen=false;sabMenuOpen=false;return;}
  if(GS!=='playing'||!ME||ME.dead)return;
  if(k===' '&&D(ME,EB)<EB_R){callMeeting(ME,'Emergency meeting called!');return;}
  if(k==='e'){
    if(activeSab){
      const d=SAB_DEFS[activeSab.type];
      if(myRole==='crewmate'&&D(ME,{x:d.fixX,y:d.fixY})<TASK_R){fixSab();return;}
    }
    if(myRole==='crewmate'){const t=tasks.find(t=>!t.done&&D(ME,t)<TASK_R);if(t){currentTask=t;GS='task';showTask(t);}}
    return;
  }
  if(k==='r'){const b=bodies.find(b=>D(ME,b)<BODY_R);if(b)callMeeting(ME,`${ME.name} reported ${b.name}'s body!`);return;}
  if(k==='q'&&myRole==='impostor'&&killCd<=0){
    const tgt=players.find(p=>p!==ME&&!p.dead&&p.role!=='impostor'&&D(ME,p)<KILL_R);
    if(tgt){doKill(tgt);killCd=KILL_CD;}return;
  }
  if(k==='v'&&myRole==='impostor'){
    if(ventMenuOpen){ventMenuOpen=false;return;}
    const v=VENTS.find(v=>D(ME,v)<VENT_R);
    if(v){ventMenuOpen=true;sabMenuOpen=false;curVentId=v.id;}return;
  }
  if(k==='f'&&myRole==='impostor'){sabMenuOpen=!sabMenuOpen;if(sabMenuOpen)ventMenuOpen=false;return;}
}

// ═══════════════════════════════════════════════════════════════
// VENT + SABOTAGE LOGIC
// ═══════════════════════════════════════════════════════════════
function useVent(destId){
  const dest=VENTS.find(v=>v.id===destId);if(!dest)return;
  ME.x=dest.x;ME.y=dest.y;ventMenuOpen=false;updateCam();
}

function activateSab(type){
  if(sabCd>0)return;
  const d=SAB_DEFS[type];
  activeSab={type,timer:d.countdown};
  sabMenuOpen=false;sabCd=SAB_CD;
}

function fixSab(){if(!activeSab)return;activeSab=null;}

function updateSab(dt){
  if(!activeSab||activeSab.timer<=0)return;
  activeSab.timer=Math.max(0,activeSab.timer-dt);
  if(activeSab.timer<=0)endGame(false,`${SAB_DEFS[activeSab.type].n} wasn't fixed in time!`);
}

// ═══════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════
function doKill(p){p.dead=true;bodies.push({x:p.x,y:p.y,col:p.color,name:p.name});}

function checkWin(){
  const alive=players.filter(p=>!p.dead);
  const imps=alive.filter(p=>p.role==='impostor'),crew=alive.filter(p=>p.role==='crewmate');
  if(imps.length===0){endGame(true,'All impostors ejected!');return true;}
  if(imps.length>=crew.length){endGame(false,'Impostors outnumber crew!');return true;}
  if(tasks.length>0&&tasks.every(t=>t.done)){endGame(true,'All tasks completed!');return true;}
  return false;
}

function endGame(crewWin,reason){
  GS='over';clearInterval(mtgInterval);activeSab=null;
  showOv();
  const youWon=(crewWin&&myRole==='crewmate')||(!crewWin&&myRole==='impostor');
  pnl.innerHTML=`
  <div style="text-align:center">
    <div style="font-size:3em;margin-bottom:10px">${crewWin?'🚀':'👾'}</div>
    <div class="logo" style="font-size:1.7em;color:${crewWin?'#44ff44':'#ff4444'}">${crewWin?'CREWMATES WIN':'IMPOSTORS WIN'}</div>
    <p style="color:#aaa;margin:8px 0">${reason}</p>
    <p style="font-size:1.22em;margin-bottom:18px;color:${youWon?'#44ff44':'#ff4444'}">You ${youWon?'WON 🎉':'LOST 💀'}</p>
    <div style="background:rgba(0,0,0,.3);border-radius:8px;padding:10px 14px;margin-bottom:18px;text-align:left;max-height:200px;overflow-y:auto">
      ${players.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)">
        <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${p.color};margin-right:8px;vertical-align:middle"></span>${p.name}${p.isMe?' (YOU)':''}</span>
        <span style="color:${p.role==='impostor'?'#ff5555':'#55cc55'};font-size:.88em">${p.role.toUpperCase()}${p.dead?' ✗':''}</span>
      </div>`).join('')}
    </div>
    <button class="btn btn-red" onclick="showMenu()">▶ Play Again</button>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// BOT AI
// ═══════════════════════════════════════════════════════════════
function updateBot(p,dt){
  if(p.dead)return;
  p.killCd=Math.max(0,p.killCd-dt);p.actTimer-=dt;
  if(p.sabCd!==undefined)p.sabCd=Math.max(0,p.sabCd-dt);

  if(p.role==='impostor'){
    if(p.killCd<=0){
      const tgt=players.find(q=>q!==p&&!q.dead&&q.role!=='impostor'&&D(p,q)<45);
      if(tgt){
        const wit=players.filter(q=>q!==p&&q!==tgt&&!q.dead&&q.role!=='impostor'&&D(p,q)<120);
        if(wit.length===0&&Math.random()<.38){doKill(tgt);p.killCd=KILL_CD;checkWin();return;}
      }
    }
    // Occasional bot sabotage
    if(p.sabCd===0&&!activeSab&&Math.random()<.0006){
      const types=['lights','reactor','o2'];
      activateSab(types[Math.floor(Math.random()*types.length)]);
      p.sabCd=SAB_CD+rnd(15,30);
    }
    // Occasional vent usage
    if(Math.random()<.0015){
      const nv=VENTS.find(v=>D(p,v)<VENT_R);
      if(nv){const opts=VENTS.filter(v=>v.net===nv.net&&v.id!==nv.id);if(opts.length){const d=opts[Math.floor(Math.random()*opts.length)];p.x=d.x;p.y=d.y;}}
    }
  }

  // Crewmate bots: help fix critical sabotages
  if(p.role==='crewmate'&&activeSab&&activeSab.type!=='lights'&&Math.random()<.004){
    const d=SAB_DEFS[activeSab.type];p.wp={x:d.fixX,y:d.fixY};
    if(D(p,{x:d.fixX,y:d.fixY})<30){fixSab();}
  }

  if(p.actTimer<=0||!p.wp){p.wp=WPS[Math.floor(Math.random()*WPS.length)];p.actTimer=rnd(3,8);}
  const dx=p.wp.x-p.x,dy=p.wp.y-p.y,dd=Math.hypot(dx,dy);
  if(dd>5){
    const spd=1.5,nx=p.x+(dx/dd)*spd,ny=p.y+(dy/dd)*spd;
    if(walkable(nx,ny)){p.x=nx;p.y=ny;}else if(walkable(nx,p.y))p.x=nx;else if(walkable(p.x,ny))p.y=ny;else p.actTimer=0;
  }
}

// ═══════════════════════════════════════════════════════════════
// MEETING
// ═══════════════════════════════════════════════════════════════
function callMeeting(caller,reason){
  if(GS!=='playing')return;
  GS='meeting';bodies=[];activeSab=null;sabMenuOpen=false;ventMenuOpen=false;
  chatMsgs=[reason];votes={};hasVoted=false;myVote=null;mtgPhase='disc';mtgTimer=DISC_DUR;
  const alive=players.filter(p=>!p.dead);
  alive.forEach(p=>{
    if(!p.isMe&&Math.random()<.52){
      const locs=ROOMS.filter(r=>r.n).map(r=>r.n);
      const subs=[
        `Not me, I was in ${locs[Math.floor(Math.random()*locs.length)]}!`,
        `I saw ${alive[Math.floor(Math.random()*alive.length)].name} near a vent`,
        'I was doing tasks!','Where was everyone?','Vote out the impostor!',
      ];
      setTimeout(()=>{chatMsgs.push(`${p.name}: ${subs[Math.floor(Math.random()*subs.length)]}`);renderMtg();},rnd(800,6000));
    }
  });
  clearInterval(mtgInterval);
  mtgInterval=setInterval(()=>{
    mtgTimer--;
    if(mtgTimer<=0){
      if(mtgPhase==='disc'){
        mtgPhase='vote';mtgTimer=VOTE_DUR;
        players.forEach(p=>{
          if(p.isMe||p.dead)return;
          const c=players.filter(q=>!q.dead);
          if(p.role==='impostor'){const cr=c.filter(q=>q.role==='crewmate');votes[p.name]=cr.length?cr[Math.floor(Math.random()*cr.length)].name:'skip';}
          else votes[p.name]=Math.random()<.18?'skip':c[Math.floor(Math.random()*c.length)].name;
        });
      } else {clearInterval(mtgInterval);resolveVote();return;}
    }
    renderMtg();
  },1000);
  showOv();renderMtg();
}

function renderMtg(){
  const alive=players.filter(p=>!p.dead),isVote=mtgPhase==='vote';
  const vc=n=>Object.values(votes).filter(v=>v===n).length;
  pnl.innerHTML=`
  <h2 style="font-family:'Orbitron',sans-serif;color:#ff8844;text-align:center;font-size:1.45em;margin-bottom:4px">⚠ EMERGENCY MEETING</h2>
  <div class="chatlog" id="clog">${chatMsgs.map(m=>`<div>${m}</div>`).join('')}</div>
  <div class="mtimer">${isVote?'⚖ VOTE':'💬 DISCUSS'}: ${mtgTimer}s</div>
  ${!isVote?`<p style="text-align:center;color:#666;font-size:.84em;margin-bottom:8px">Voting opens when timer ends</p>`:''}
  <div class="vgrid">
    ${alive.map(p=>{const voted=myVote===p.name,cnt=vc(p.name);return`<div class="vcard${voted?' voted':''}" ${isVote&&!hasVoted?`onclick="doVote('${p.name}')"`:''} ${!isVote||hasVoted?'disabled':''}>
      <div class="vdot" style="background:${p.color}"></div><div>${p.name}${p.isMe?' (YOU)':''}</div>
      ${isVote?`<div style="font-size:.74em;color:#aaa">${cnt} vote${cnt!==1?'s':''}</div>`:''}
    </div>`;}).join('')}
    <div class="vcard${myVote==='skip'?' voted':''}" ${isVote&&!hasVoted?'onclick="doVote(\'skip\')"':''} ${!isVote||hasVoted?'disabled':''}>
      <div style="font-size:1.5em">🚫</div><div>Skip</div>${isVote?`<div style="font-size:.74em;color:#aaa">${vc('skip')} votes</div>`:''}
    </div>
  </div>
  ${hasVoted?`<p style="text-align:center;color:#44ff44;font-size:.88em">✓ Vote cast!</p>`:''}`;
  const cl=document.getElementById('clog');if(cl)cl.scrollTop=cl.scrollHeight;
}

window.doVote=function(t){if(hasVoted||mtgPhase!=='vote')return;hasVoted=true;myVote=t;if(ME&&!ME.dead)votes[ME.name]=t;renderMtg();};

function resolveVote(){
  const tally={};Object.values(votes).forEach(v=>tally[v]=(tally[v]||0)+1);
  let maxV=0,ejected=null;
  Object.entries(tally).forEach(([n,c])=>{if(c>maxV){maxV=c;ejected=n;}});
  const topC=Math.max(0,...Object.values(tally));
  const ties=Object.values(tally).filter(c=>c===topC).length>1;
  let msg='';
  if(!ejected||ejected==='skip'||ties)msg='No one was ejected.<br><span style="color:#888;font-size:.9em">Skipped or tied</span>';
  else{const ep=players.find(p=>p.name===ejected);if(ep){ep.dead=true;const wi=ep.role==='impostor';msg=`<span style="color:${wi?'#ff4444':'#aaddaa'}">${ep.name} was ejected!</span><br><span style="font-size:.9em;color:#aaa">${wi?'✓ Was an Impostor!':'✗ Was NOT an Impostor'}</span>`;}}
  GS='playing';
  pnl.innerHTML=`<h2 style="font-family:'Orbitron',sans-serif;color:#ff8844;text-align:center;font-size:1.42em;margin-bottom:14px">Meeting Result</h2>
  <p style="text-align:center;font-size:1.05em;margin-bottom:18px;line-height:1.75">${msg}</p>
  <div style="text-align:center"><button class="btn btn-blue" onclick="resumeGame()">Continue →</button></div>`;
  if(!checkWin()){}
}

window.resumeGame=function(){
  if(GS==='over')return;
  const living=players.filter(p=>!p.dead);
  living.forEach((p,i)=>{const s=SPAWNS[i%SPAWNS.length];p.x=s.x+rnd(-12,12);p.y=s.y+rnd(-12,12);});
  killCd=12;lastT=performance.now();hideOv();GS='playing';
};

// ═══════════════════════════════════════════════════════════════
// TASK MINI-GAMES
// ═══════════════════════════════════════════════════════════════
function showTask(t){showOv();const tp=t.type||'button';
  if(tp==='wire')showWire(t);else if(tp==='swipe')showSwipe(t);else if(tp==='code')showCode(t);
  else if(tp==='prog')showProg(t);else if(tp==='canister')showCanister(t);
  else if(tp==='scan')showScan(t);else if(tp==='asteroids')showAsteroids(t);
  else if(tp==='switches')showSwitches(t);else if(tp==='pattern')showPattern(t);
  else showBtn(t);}
window.taskDone=function(){if(currentTask){currentTask.done=true;currentTask=null;}GS='playing';hideOv();checkWin();};
window.cancelTask=function(){currentTask=null;GS='playing';hideOv();};

function showWire(t){
  const WC=['#e03030','#4040ee','#30cc30','#eecc22'];
  const left=shuffle(WC),right=shuffle(WC);let matched={},selL=null;
  const render=()=>{pnl.innerHTML=`<h3 style="color:#44aaff;text-align:center;margin-bottom:4px;font-family:'Orbitron',sans-serif">Fix Wiring</h3>
    <p style="color:#888;text-align:center;font-size:.84em;margin-bottom:12px">${t.r} — Connect matching colours</p>
    <div class="tbox"><div class="wrow">
      <div class="wcol">${left.map((c,i)=>`<div class="wnode${matched['L'+i]?' wmatched':''}${selL===i?' wsel':''}" style="background:${c}" onclick="wClick('L',${i})"></div>`).join('')}</div>
      <svg style="flex:1;height:185px" viewBox="0 0 200 185">
        ${left.map((c,i)=>{if(!matched['L'+i])return'';const ri=right.indexOf(c);return`<path d="M18,${24+i*46} C100,${24+i*46} 100,${24+ri*46} 182,${24+ri*46}" fill="none" stroke="${c}" stroke-width="3.5" opacity=".82"/>`;}).join('')}
        ${selL!==null?`<path d="M18,${24+selL*46} C80,${24+selL*46} 120,92 100,92" fill="none" stroke="${left[selL]}" stroke-width="2" stroke-dasharray="5,4" opacity=".5"/>`:''}
      </svg>
      <div class="wcol">${right.map((c,i)=>{const isMat=Object.entries(matched).some(([k,v])=>v===i);return`<div class="wnode${isMat?' wmatched':''}" style="background:${c}" onclick="wClick('R',${i})"></div>`;}).join('')}</div>
    </div></div>
    <div style="text-align:center;margin-top:10px"><button class="btn btn-dark" onclick="cancelTask()">Cancel</button></div>`;};
  window.wClick=function(side,idx){if(side==='L'){if(matched['L'+idx])return;selL=idx;}else{if(selL===null)return;if(left[selL]===right[idx]){matched['L'+selL]=idx;selL=null;if(Object.keys(matched).length===4){setTimeout(window.taskDone,280);return;}}else selL=null;}render();};
  render();
}

function showProg(t){
  const start=Date.now(),DUR=3200;
  const tick=()=>{if(GS!=='task')return;const p=Math.min(1,(Date.now()-start)/DUR);const el=document.getElementById('pb'),pt=document.getElementById('pp');if(el)el.style.width=(p*100)+'%';if(pt)pt.textContent=Math.round(p*100)+'%';if(p>=1){setTimeout(window.taskDone,200);return;}requestAnimationFrame(tick);};
  pnl.innerHTML=`<h3 style="color:#44aaff;text-align:center;margin-bottom:4px;font-family:'Orbitron',sans-serif">${t.n}</h3>
    <p style="color:#888;text-align:center;font-size:.84em;margin-bottom:14px">${t.r} — Processing...</p>
    <div class="tbox"><div class="pbbg"><div class="pbfill" id="pb" style="width:0%"></div></div>
    <div id="pp" style="text-align:center;margin-top:8px;font-family:'Orbitron',sans-serif;color:#44aaff;font-size:1.28em">0%</div></div>
    <div style="text-align:center;margin-top:12px"><button class="btn btn-dark" onclick="cancelTask()">Cancel</button></div>`;
  requestAnimationFrame(tick);
}

function showCode(t){
  const code=Array.from({length:4},()=>Math.floor(Math.random()*10)).join('');let entered='';

// ── Clear Asteroids ───────────────────────────────────────────
function showAsteroids(t){
  const NUM=6;
  const W2=520,H2=260;
  let rocks=Array.from({length:NUM},(_,i)=>({
    id:i,x:40+Math.random()*(W2-80),y:30+Math.random()*(H2-60),
    r:12+Math.random()*10,vx:(Math.random()-.5)*0.4,vy:(Math.random()-.5)*0.4,
    alive:true,boom:0
  }));
  let raf2=null,lastA=Date.now();
  const cv2=document.createElement('canvas');
  cv2.width=W2;cv2.height=H2;cv2.style.cssText=`display:block;margin:0 auto;border-radius:8px;cursor:crosshair;border:1px solid #333;background:#000010`;
  const c2=cv2.getContext('2d');

  const draw=()=>{
    c2.clearRect(0,0,W2,H2);
    // Stars
    c2.fillStyle='#ffffff';
    [[50,40],[120,80],[200,30],[300,100],[400,50],[480,120],[80,180],[250,200],[430,170]].forEach(([x,y])=>{
      c2.beginPath();c2.arc(x,y,1,0,Math.PI*2);c2.fill();
    });
    rocks.forEach(a=>{
      if(a.boom>0){
        c2.strokeStyle=`rgba(255,${150+a.boom*3},50,${a.boom/20})`;
        c2.lineWidth=2;
        for(let i=0;i<8;i++){const ang=i*Math.PI/4,d=(20-a.boom)*2;
          c2.beginPath();c2.moveTo(a.x,a.y);c2.lineTo(a.x+Math.cos(ang)*d,a.y+Math.sin(ang)*d);c2.stroke();
        }
        a.boom--;return;
      }
      if(!a.alive)return;
      c2.fillStyle='#7a6a5a';c2.strokeStyle='#aaa090';c2.lineWidth=1.5;
      c2.beginPath();
      for(let i=0;i<8;i++){const ang=i*Math.PI/4,R=a.r*(0.8+0.2*Math.sin(i*2.1));
        i===0?c2.moveTo(a.x+Math.cos(ang)*R,a.y+Math.sin(ang)*R):c2.lineTo(a.x+Math.cos(ang)*R,a.y+Math.sin(ang)*R);
      }
      c2.closePath();c2.fill();c2.stroke();
    });
    const left=rocks.filter(a=>a.alive).length;
    c2.fillStyle=left>0?'#ffaa44':'#44ff88';
    c2.font='bold 12px "Share Tech Mono"';c2.textAlign='left';
    c2.fillText(left>0?`Destroy all ${left} asteroid${left!==1?'s':''}!`:'All clear! ✓',10,H2-10);
  };

  const tick=()=>{
    if(GS!=='task')return;
    const now=Date.now(),dt=(now-lastA)/16;lastA=now;
    rocks.forEach(a=>{
      if(!a.alive)return;
      a.x=(a.x+a.vx*dt+W2)%W2;a.y=(a.y+a.vy*dt+H2)%H2;
    });
    draw();
    if(rocks.every(a=>!a.alive)){setTimeout(window.taskDone,400);return;}
    raf2=requestAnimationFrame(tick);
  };

  cv2.addEventListener('click',e=>{
    const rect=cv2.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    rocks.forEach(a=>{
      if(!a.alive)return;
      if(Math.hypot(mx-a.x,my-a.y)<a.r+6){a.alive=false;a.boom=18;}
    });
  });

  pnl.innerHTML=`
  <h3 style="color:#ff4444;text-align:center;margin-bottom:4px;font-family:'Orbitron',sans-serif">Clear Asteroids</h3>
  <p style="color:#888;text-align:center;font-size:.84em;margin-bottom:10px">${t.r} — Click every asteroid to destroy it</p>
  <div class="tbox" style="padding:10px" id="astBox"></div>
  <div style="text-align:center;margin-top:8px"><button class="btn btn-dark" onclick="cancelTask()">Cancel</button></div>`;
  document.getElementById('astBox').appendChild(cv2);
  raf2=requestAnimationFrame(tick);
}

// ── Reactor Sequence (Simon Says) ─────────────────────────────
function showPattern(t){
  const COLS=['#e03030','#3030ee','#30cc30','#dddd20'];
  const LBLS=['red','blue','green','yellow'];
  const SEQ_LEN=4,ROUNDS=3;
  let seq=[],playerSeq=[],round=0,phase='show',showing=-1,blocked=true;

  const genSeq=()=>{seq=Array.from({length:SEQ_LEN},()=>Math.floor(Math.random()*4));};
  genSeq();

  const render=(flash=-1,msg='')=>{
    pnl.innerHTML=`
    <h3 style="color:#ff8844;text-align:center;margin-bottom:4px;font-family:'Orbitron',sans-serif">Reactor Sequence</h3>
    <p style="color:#888;text-align:center;font-size:.84em;margin-bottom:4px">${t.r} — Repeat the colour sequence</p>
    <p style="color:#ffaa44;text-align:center;font-size:.84em;margin-bottom:14px">Round ${round+1} / ${ROUNDS}</p>
    <div class="tbox" style="text-align:center">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:260px;margin:0 auto 14px">
        ${COLS.map((c,i)=>`
        <div onclick="patPress(${i})" style="height:80px;border-radius:10px;
          background:${i===flash?c:`${c}44`};
          border:2px solid ${i===flash?c:`${c}88`};
          box-shadow:${i===flash?`0 0 22px ${c}`:'none'};
          cursor:${blocked?'default':'pointer'};
          transition:all .12s;display:flex;align-items:center;justify-content:center;
          font-size:.75em;color:${i===flash?'#fff':'#888'};font-family:'Share Tech Mono'">
          ${LBLS[i].toUpperCase()}
        </div>`).join('')}
      </div>
      <div style="color:${msg.includes('Wrong')?'#ff4444':'#44ff88'};font-size:.9em;min-height:20px">${msg}</div>
      <div style="display:flex;justify-content:center;gap:8px;margin-top:10px">
        ${Array.from({length:SEQ_LEN},(_,i)=>`<div style="width:12px;height:12px;border-radius:50%;background:${i<playerSeq.length?COLS[seq[i]]:'#333'};border:1px solid #555"></div>`).join('')}
      </div>
      <p style="color:#666;font-size:.8em;margin-top:8px">${blocked?'Watch the sequence...':'Your turn — repeat it!'}</p>
    </div>
    <div style="text-align:center;margin-top:10px"><button class="btn btn-dark" onclick="cancelTask()">Cancel</button></div>`;
  };

  window.patPress=i=>{
    if(blocked||phase!=='input')return;
    playerSeq.push(i);render(-1,'');
    if(seq[playerSeq.length-1]!==i){
      render(i,'Wrong! Restarting...');
      setTimeout(()=>{playerSeq=[];startShow();},900);
      return;
    }
    if(playerSeq.length===SEQ_LEN){
      round++;
      if(round>=ROUNDS){render(-1,'✓ Complete!');setTimeout(window.taskDone,500);return;}
      genSeq();playerSeq=[];
      setTimeout(startShow,600);
    }
  };

  const startShow=()=>{
    blocked=true;phase='show';playerSeq=[];let i=0;
    render(-1);
    const showNext=()=>{
      if(i>=SEQ_LEN){phase='input';blocked=false;render(-1);return;}
      render(seq[i]);
      setTimeout(()=>{render(-1);setTimeout(()=>{i++;showNext();},200);},500);
    };
    setTimeout(showNext,400);
  };
  startShow();
}

    <span class="key">R</span> Report &nbsp;<span class="key">SPACE</span> Emergency meeting (Cafeteria)<br>
    <span style="color:#8888bb;font-size:.87em">On-screen buttons appear at bottom during gameplay.<br>
    SVG icons load from <code style="color:#aaccff">among us/</code> folder next to this HTML file.</span>
  </div>
  <p style="text-align:center;margin:10px 0 8px;color:#aaa">Choose your colour:</p>
  <div class="colsel">${PCOLS.map((c,i)=>`<div class="cbtn${i===0?' csel':''}" style="background:${c.h}" title="${c.n}" onclick="selectColor(${i})"></div>`).join('')}</div>
  <div style="text-align:center;margin-top:18px">
    <button class="btn btn-red" onclick="startGame()" style="font-size:1.15em;padding:13px 44px;letter-spacing:3px">▶ PLAY</button>
  </div>`;
};

// ═══════════════════════════════════════════════════════════════
// START GAME
// ═══════════════════════════════════════════════════════════════
window.startGame=function(){
  bodies=[];chatMsgs=[];currentTask=null;killCd=KILL_CD;sabCd=0;
  activeSab=null;sabMenuOpen=false;ventMenuOpen=false;clearInterval(mtgInterval);
  const myC=PCOLS[selCI];
  const botIdxs=shuffle(PCOLS.map((_,i)=>i).filter(i=>i!==selCI)).slice(0,9);
  const roles=shuffle(['impostor','impostor',...Array(8).fill('crewmate')]);
  myRole=roles[0];
  const sp=shuffle([...SPAWNS]);
  players=[
    {name:myC.n,color:myC.h,role:myRole,x:sp[0].x,y:sp[0].y,dead:false,isMe:true,wp:null,actTimer:0,killCd:KILL_CD,sabCd:SAB_CD},
    ...botIdxs.map((ci,i)=>({
      name:PCOLS[ci].n,color:PCOLS[ci].h,role:roles[i+1],
      x:sp[i+1].x,y:sp[i+1].y,dead:false,isMe:false,
      wp:WPS[i%WPS.length],actTimer:rnd(1,5),killCd:rnd(10,22),sabCd:rnd(20,40),
    }))
  ];
  ME=players[0];
  const crew=players.filter(p=>p.role==='crewmate');
  const pool=shuffle([...TASK_SPOTS]);tasks=[];let ti=0;
  crew.forEach(p=>{for(let k=0;k<TASKS_EACH&&ti<pool.length;k++,ti++)tasks.push({...pool[ti],done:false,owner:p.name});});
  GS='playing';lastT=performance.now();
  camX=ME.x-W/2;camY=ME.y-H/2;hideOv();
};

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
function update(now){
  if(GS!=='playing')return;
  const dt=Math.min((now-lastT)/1000,.1);lastT=now;
  if(killCd>0)killCd-=dt;if(sabCd>0)sabCd-=dt;
  updateSab(dt);
  if(ME&&!ME.dead){
    let mx=0,my=0;
    if(keys['w']||keys['arrowup'])   my=-1;if(keys['s']||keys['arrowdown']) my=1;
    if(keys['a']||keys['arrowleft']) mx=-1;if(keys['d']||keys['arrowright'])mx=1;
    if(mx||my){
      const len=Math.hypot(mx,my),nx=ME.x+(mx/len)*SPD,ny=ME.y+(my/len)*SPD;
      if(walkable(nx,ny)){ME.x=nx;ME.y=ny;}else if(walkable(nx,ME.y))ME.x=nx;else if(walkable(ME.x,ny))ME.y=ny;
    }
  }
  players.forEach(p=>{if(!p.isMe)updateBot(p,dt);});
  updateCam();
}

function render(){
  drawMap();drawTasks();drawBodies();
  [...players].sort((a,b)=>{if(a.isMe)return 1;if(b.isMe)return-1;if(a.dead&&!b.dead)return-1;if(!a.dead&&b.dead)return 1;return 0;})
    .forEach(p=>{const allDead=players.filter(q=>q.role==='impostor').every(q=>q.dead);drawPly(p,p.isMe||allDead||GS==='over');});
  applyLights();
  drawHUD();
  updateActionBar();
}

function frame(now){
  if(GS==='playing'){update(now);render();}
  else if(GS!=='menu'){lastT=now;render();}
  requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
window.showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
